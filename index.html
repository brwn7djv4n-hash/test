<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POLICE DEPARTMENT WEBSITE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background: radial-gradient(circle at center,
    #45206e 0%,
    #18062d 40%,
    #050010 100%);
    overflow:hidden;
}

.logo{
    width:250px;
    margin-bottom:30px;
    filter: drop-shadow(0 0 20px #9b5cff);
}

.title{
    font-size:4rem;
    font-weight:bold;
    background:linear-gradient(90deg,#00d4ff,#ff66ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:20px;
}

.subtitle{
    color:#55ffff;
    letter-spacing:4px;
    margin-bottom:50px;
}

.enter-btn{
    padding:18px 60px;
    border-radius:50px;
    border:none;
    cursor:pointer;
    font-size:18px;
    color:white;
    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,0.2);
    transition:0.3s;
    box-shadow:0 0 25px rgba(0,255,255,.2);
}

.enter-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 35px rgba(255,0,255,.5);
}
</style>
</head>

<body>

<img class="logo" src="logo.png">

<div class="title">POLICE DEPARTMENT WEBSITE</div>

<div class="subtitle">
OFFICIAL WEBSITE By.YUNYUN
</div>

<button class="enter-btn"
onclick="window.location.href='YOUR_LINK';">
CLICK ENTER TO WEBSITE
</button>

</body>
</html>
